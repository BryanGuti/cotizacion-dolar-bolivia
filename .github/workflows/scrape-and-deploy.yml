name: Scrape and deploy Dólar Bolivia

on:
  push:
  schedule:
    - cron: "17 1,3,5,7,9,11 * * *"
      timezone: "America/La_Paz"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dolar-bolivia-production
  cancel-in-progress: false

jobs:
  test:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install requirements
        run: python -m pip install -r requirements.txt

      - name: Run automated tests
        run: python -m pytest -v

  scrape:
    if: >-
      (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install requirements
        run: python -m pip install -r requirements.txt

      - name: Collect exchange rates
        id: scrape
        run: python -m scraper.main

      - name: Diagnose BCP connectivity after a failed scrape
        if: ${{ always() && steps.scrape.outcome == 'failure' }}
        run: python -m scraper.diagnose_bcp

      - name: Validate public current and historical data
        run: python -m scraper.validate_public_data

      - name: Commit and push changed public data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all -- frontend/data/current.json frontend/data/history/
          if ! git diff --cached --quiet -- frontend/data/current.json frontend/data/history/; then
            git commit -m "Update exchange rate data"
            git push origin "HEAD:${GITHUB_REF}"
          else
            echo "No public data changes to commit."
          fi

      - name: Package the updated frontend
        run: tar -czf "${RUNNER_TEMP}/frontend.tar.gz" -C frontend .

      - name: Upload updated frontend for this run
        uses: actions/upload-artifact@v4
        with:
          name: scraped-frontend
          path: ${{ runner.temp }}/frontend.tar.gz
          if-no-files-found: error
          retention-days: 1

  prepare-pages:
    if: >-
      always() &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
      needs.test.result == 'success' &&
      (github.event_name == 'push' || needs.scrape.result == 'success')
    needs: [test, scrape]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      actions: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Download frontend from the scraper run
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        uses: actions/download-artifact@v4
        with:
          name: scraped-frontend
          path: ${{ runner.temp }}/scraped-frontend

      - name: Restore the frontend artifact
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: tar -xzf "${RUNNER_TEMP}/scraped-frontend/frontend.tar.gz" -C frontend

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload frontend only
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend

  deploy:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    needs: prepare-pages
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
